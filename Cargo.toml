[package]
name = "obex-map-get"
version = "0.1.0"
edition = "2021"

[dependencies]
libc = "0.2"
nix = "0.26"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
regex = "1.5"
xml-rs = "0.8"
log = "0.4"
env_logger = "0.10"

[[bin]]
name = "obex-map-get"
path = "src/main.rs"
